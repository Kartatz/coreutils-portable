name: Build

on:
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:
  push:
    branches:
        - '**'

permissions: write-all

jobs:
  cross-build:
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      matrix:
        include:
          # Windows: coreutils requires a POSIX system (e.g. 'pwd.h' is missing
          # on native Windows); it is not buildable with MinGW, only Cygwin.

          # macOS
          - target: 'aarch64-unknown-apple-darwin'
          - target: 'x86_64-unknown-apple-darwin'

          # Linux (glibc)
          - { target: 'x86_64-unknown-linux-gnu', glibc: '2.3' }
          - { target: 'x86_64-unknown-linux-gnu', glibc: '2.7' }
          - { target: 'x86_64-unknown-linux-gnu', glibc: '2.11' }
          - { target: 'x86_64-unknown-linux-gnu', glibc: '2.13' }
          - { target: 'x86_64-unknown-linux-gnu', glibc: '2.15' }
          - { target: 'x86_64-unknown-linux-gnu', glibc: '2.17' }
          - { target: 'x86_64-unknown-linux-gnu', glibc: '2.19' }
          - { target: 'x86_64-unknown-linux-gnu', glibc: '2.23' }
          - { target: 'x86_64-unknown-linux-gnu', glibc: '2.24' }
          - { target: 'x86_64-unknown-linux-gnu', glibc: '2.27' }
          - { target: 'x86_64-unknown-linux-gnu', glibc: '2.28' }
          - { target: 'x86_64-unknown-linux-gnu', glibc: '2.31' }
          - { target: 'x86_64-unknown-linux-gnu', glibc: '2.35' }
          - { target: 'x86_64-unknown-linux-gnu', glibc: '2.39' }
          - { target: 'i386-unknown-linux-gnu', glibc: '2.3' }
          - { target: 'i386-unknown-linux-gnu', glibc: '2.7' }
          - { target: 'i386-unknown-linux-gnu', glibc: '2.11' }
          - { target: 'i386-unknown-linux-gnu', glibc: '2.13' }
          - { target: 'i386-unknown-linux-gnu', glibc: '2.15' }
          - { target: 'i386-unknown-linux-gnu', glibc: '2.17' }
          - { target: 'i386-unknown-linux-gnu', glibc: '2.19' }
          - { target: 'i386-unknown-linux-gnu', glibc: '2.23' }
          - { target: 'i386-unknown-linux-gnu', glibc: '2.24' }
          - { target: 'i386-unknown-linux-gnu', glibc: '2.27' }
          - { target: 'i386-unknown-linux-gnu', glibc: '2.28' }
          - { target: 'i386-unknown-linux-gnu', glibc: '2.31' }
          - { target: 'i386-unknown-linux-gnu', glibc: '2.35' }
          - { target: 'i386-unknown-linux-gnu', glibc: '2.39' }
          - { target: 'arm-unknown-linux-gnueabihf', glibc: '2.13' }
          - { target: 'arm-unknown-linux-gnueabihf', glibc: '2.17' }
          - { target: 'arm-unknown-linux-gnueabihf', glibc: '2.19' }
          - { target: 'arm-unknown-linux-gnueabihf', glibc: '2.23' }
          - { target: 'arm-unknown-linux-gnueabihf', glibc: '2.24' }
          - { target: 'arm-unknown-linux-gnueabihf', glibc: '2.27' }
          - { target: 'arm-unknown-linux-gnueabihf', glibc: '2.28' }
          - { target: 'arm-unknown-linux-gnueabihf', glibc: '2.31' }
          - { target: 'arm-unknown-linux-gnueabihf', glibc: '2.35' }
          - { target: 'arm-unknown-linux-gnueabihf', glibc: '2.39' }
          - { target: 'aarch64-unknown-linux-gnu', glibc: '2.19' }
          - { target: 'aarch64-unknown-linux-gnu', glibc: '2.23' }
          - { target: 'aarch64-unknown-linux-gnu', glibc: '2.24' }
          - { target: 'aarch64-unknown-linux-gnu', glibc: '2.27' }
          - { target: 'aarch64-unknown-linux-gnu', glibc: '2.28' }
          - { target: 'aarch64-unknown-linux-gnu', glibc: '2.31' }
          - { target: 'aarch64-unknown-linux-gnu', glibc: '2.35' }
          - { target: 'aarch64-unknown-linux-gnu', glibc: '2.39' }

          # Linux (musl)
          - target: 'aarch64-unknown-linux-musl'
          - target: 'x86_64-unknown-linux-musl'
          - target: 'armv6-unknown-linux-musleabihf'
          - target: 'armv7-unknown-linux-musleabihf'
          - target: 'i386-unknown-linux-musl'

          # FreeBSD
          - target: 'x86_64-unknown-freebsd'
          - target: 'aarch64-unknown-freebsd'
          - target: 'i386-unknown-freebsd'

          # NetBSD
          - target: 'i386-unknown-netbsdelf'
          - target: 'x86_64-unknown-netbsd'

          # DragonFly BSD
          - target: 'x86_64-unknown-dragonfly'

          # Android
          - target: 'x86_64-unknown-linux-android'
          - target: 'i686-unknown-linux-android21'
          - target: 'aarch64-unknown-linux-android'
          - target: 'armv7-unknown-linux-androideabi21'
    steps:
    - name: Checkout repository
      uses: actions/checkout@main
    - name: Install build dependencies
      run: sudo apt-get update --quiet && sudo apt-get install --quiet --yes autoconf automake autopoint bison gperf gettext m4 patch texinfo zip
    - name: Cross-compile coreutils to ${{ matrix.target }}${{ matrix.glibc }}
      working-directory: './'
      env:
        WORKDIR: '${{ github.workspace }}/coreutils-cross'
      run: |
        if [[ '${{ matrix.target }}' = *'-linux-musl'* ]]; then
            declare -r RAIDEN_TARBALL='/tmp/toolchain.tar.xz'
            declare -r RAIDEN_URL="https://github.com/AmanoTeam/musl-gcc-cross/releases/latest/download/x86_64-unknown-linux-gnu.tar.xz"

            curl --connect-timeout '10' --retry '15' --retry-all-errors --fail --silent --location --url "${RAIDEN_URL}" --output "${RAIDEN_TARBALL}"
            tar --directory="$(dirname "${RAIDEN_TARBALL}")" --extract --file="${RAIDEN_TARBALL}"

            export RAIDEN_HOME='/tmp/musl-gcc-cross'
            export PATH="${RAIDEN_HOME}/bin:${PATH}"

            source "${RAIDEN_HOME}/build/autotools/${{ matrix.target }}.sh"
        elif [[ '${{ matrix.target }}' = *'-linux-gnu'* ]]; then
            declare -r OBGGCC_TARBALL='/tmp/toolchain.tar.xz'
            declare -r OBGGCC_URL="https://github.com/AmanoTeam/obggcc/releases/download/gcc-16/x86_64-unknown-linux-gnu.tar.xz"

            curl --connect-timeout '10' --retry '15' --retry-all-errors --fail --silent --location --url "${OBGGCC_URL}" --output "${OBGGCC_TARBALL}"
            tar --directory="$(dirname "${OBGGCC_TARBALL}")" --extract --file="${OBGGCC_TARBALL}"

            export OBGGCC_HOME='/tmp/obggcc'
            export PATH="${OBGGCC_HOME}/bin:${PATH}"

            source "${OBGGCC_HOME}/build/autotools/${{ matrix.target }}${{ matrix.glibc }}.sh"
        elif [[ '${{ matrix.target }}' = *'-freebsd' ]]; then
            declare -r LOKI_TARBALL='/tmp/toolchain.tar.xz'
            declare -r LOKI_URL="https://github.com/AmanoTeam/freebsd-gcc-cross/releases/latest/download/x86_64-unknown-linux-gnu.tar.xz"

            curl --silent --connect-timeout '10' --retry '15' --retry-all-errors --fail --location --url "${LOKI_URL}" --output "${LOKI_TARBALL}"
            tar --directory="$(dirname "${LOKI_TARBALL}")" --extract --file="${LOKI_TARBALL}"

            export LOKI_HOME='/tmp/freebsd-gcc-cross'
            export PATH="${LOKI_HOME}/bin:${PATH}"

            source "${LOKI_HOME}/build/autotools/${{ matrix.target }}.sh"
        elif [[ '${{ matrix.target }}' = *'-netbsd'* ]]; then
            declare -r DAKINI_TARBALL='/tmp/toolchain.tar.xz'
            declare -r DAKINI_URL="https://github.com/AmanoTeam/netbsd-gcc-cross/releases/latest/download/x86_64-unknown-linux-gnu.tar.xz"

            curl --connect-timeout '10' --retry '15' --retry-all-errors --fail --silent --location --url "${DAKINI_URL}" --output "${DAKINI_TARBALL}"
            tar --directory="$(dirname "${DAKINI_TARBALL}")" --extract --file="${DAKINI_TARBALL}"

            export DAKINI_HOME='/tmp/netbsd-gcc-cross'
            export PATH="${DAKINI_HOME}/bin:${PATH}"

            source "${DAKINI_HOME}/build/autotools/${{ matrix.target }}.sh"
        elif [[ '${{ matrix.target }}' = *'-dragonfly' ]]; then
            declare -r VENTI_TARBALL='/tmp/toolchain.tar.xz'
            declare -r VENTI_URL="https://github.com/AmanoTeam/dragonfly-gcc-cross/releases/latest/download/x86_64-unknown-linux-gnu.tar.xz"

            curl --connect-timeout '10' --retry '15' --retry-all-errors --fail --silent --location --url "${VENTI_URL}" --output "${VENTI_TARBALL}"
            tar --directory="$(dirname "${VENTI_TARBALL}")" --extract --file="${VENTI_TARBALL}"

            export VENTI_HOME='/tmp/dragonfly-gcc-cross'
            export PATH="${VENTI_HOME}/bin:${PATH}"

            source "${VENTI_HOME}/build/autotools/${{ matrix.target }}.sh"
        elif [[ '${{ matrix.target }}' = *'-mingw32' ]]; then
            declare -r MINGW_TARBALL='/tmp/toolchain.tar.xz'
            declare -r MINGW_URL="https://github.com/AmanoTeam/mingw-gcc-cross/releases/latest/download/x86_64-unknown-linux-gnu.tar.xz"

            curl --connect-timeout '10' --retry '15' --retry-all-errors --fail --silent --location --url "${MINGW_URL}" --output "${MINGW_TARBALL}"
            tar --directory="$(dirname "${MINGW_TARBALL}")" --extract --file="${MINGW_TARBALL}"

            export MINGW_HOME='/tmp/mingw-gcc-cross'
            export PATH="${MINGW_HOME}/bin:${PATH}"

            source "${MINGW_HOME}/build/autotools/${{ matrix.target }}${{ matrix.glibc }}.sh"
        elif [[ '${{ matrix.target }}' = *'-darwin' ]]; then
            curl \
                --silent \
                --show-error \
                --fail \
                --url 'https://raw.githubusercontent.com/AmanoTeam/darwin-clang-cross/refs/heads/master/main.sh' \
                    | bash -s -- install

            export DARWIN_HOME='/tmp/darwin-clang-cross'
            export PATH="${DARWIN_HOME}/bin:${PATH}"

            source "${DARWIN_HOME}/build/autotools/${{ matrix.target }}.sh"
        elif [[ '${{ matrix.target }}' = *'-android'* ]]; then
            declare -r PINO_TARBALL='/tmp/toolchain.tar.xz'
            declare -r PINO_URL="https://github.com/AmanoTeam/android-gcc-cross/releases/latest/download/x86_64-unknown-linux-gnu.tar.xz"

            curl --connect-timeout '10' --retry '15' --retry-all-errors --fail --silent --location --url "${PINO_URL}" --output "${PINO_TARBALL}"
            tar --directory="$(dirname "${PINO_TARBALL}")" --extract --file="${PINO_TARBALL}"

            export PINO_HOME='/tmp/android-gcc-cross'
            export PATH="${PINO_HOME}/bin:${PATH}"

            source "${PINO_HOME}/build/autotools/${{ matrix.target }}${{ matrix.glibc }}.sh"
        fi

        echo "CROSS_COMPILE_TRIPLET=${CROSS_COMPILE_TRIPLET}" >> "${GITHUB_ENV}"

        './build.sh'
    - name: Generate tarball
      run: |
        declare tarball_filename='/tmp/${{ matrix.target }}${{ matrix.glibc }}.tar.xz'
        tar --directory='${{ github.workspace }}/coreutils-cross/out' --create --file=- 'usr' | xz --threads='0' --extreme --memlimit-compress='100%' --compress -9 > "${tarball_filename}"
        sha256sum "${tarball_filename}" | sed 's|/tmp/||' > "${tarball_filename}.sha256"
    - name: Upload artifact
      uses: actions/upload-artifact@main
      with:
        name: ${{ matrix.target }}${{ matrix.glibc }}
        if-no-files-found: error
        path: |
          /tmp/${{ matrix.target }}${{ matrix.glibc }}.*

  release:
    needs: cross-build
    runs-on: ubuntu-latest
    name: Create release
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@main
      - name: Create release
        uses: softprops/action-gh-release@master
        with:
          tag_name: 'latest'
          name: 'GNU coreutils (rolling)'
          files: ./*/*.tar.xz
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          body: '* Rolling release tracking GNU coreutils master, cross-compiled with the AmanoTeam cross toolchains.'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
